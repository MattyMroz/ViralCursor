<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pokey Cursor - Fast Hold</title>
<style>
  * {
    box-sizing: border-box;
    user-select: none;
    -webkit-user-select: none;
  }
  html, body {
    margin: 0;
    min-height: 100%;
    cursor: none !important;
  }
  body {
    min-height: 100vh;
    overflow: hidden;
    background: #f3f2ed;
    color: #111;
    font-family: Arial, Helvetica, sans-serif;
  }
  .stage {
    min-height: 100vh;
    display: grid;
    place-items: center;
    text-align: center;
    padding: 40px;
  }
  .stage h1 {
    margin: 0 0 12px;
    font-size: clamp(40px, 8vw, 100px);
    letter-spacing: -.055em;
    line-height: .9;
  }
  .stage p {
    margin: 0;
    font-size: clamp(16px, 2vw, 22px);
    opacity: .55;
  }

  /* Exact cursor container geometry from pokeyapp.com */
  #hero-cursor {
    pointer-events: none;
    z-index: 9999;
    transform-origin: 25px 2px;
    display: none;
    position: fixed;
    transform: rotate(-20deg);
    left: 0;
    top: 0;
  }
  #hero-pointer {
    display: block;
    transform-origin: 50% 100%;
    will-change: transform;
  }

  /* Exact keyframes from the site */
  @keyframes poke-gentle {
    0% { transform: translateY(0) }
    25% { transform: translateY(-14px) }
    55% { transform: translateY(-5px) }
    75% { transform: translateY(-9px) }
    100% { transform: translateY(0) }
  }
  @keyframes poke-medium {
    0% { transform: translateY(0) rotate(0) }
    15% { transform: translateY(-12px) rotate(-2deg) }
    35% { transform: translateY(26px) rotate(3deg) }
    55% { transform: translateY(6px) rotate(1deg) }
    75% { transform: translateY(13px) rotate(2deg) }
    100% { transform: translateY(0) rotate(0) }
  }
  @keyframes poke-strong {
    0% { transform: translateY(0) rotate(0) }
    10% { transform: translateY(-12px) rotate(-2deg) }
    30% { transform: translateY(44px) rotate(4deg) }
    50% { transform: translateY(10px) rotate(1deg) }
    68% { transform: translateY(26px) rotate(3deg) }
    84% { transform: translateY(4px) rotate(0) }
    100% { transform: translateY(0) rotate(0) }
  }
  @keyframes poke-jab {
    0% { transform: translateY(0) rotate(0) }
    8% { transform: translateY(-12px) rotate(-2deg) }
    26% { transform: translateY(92px) rotate(6deg) }
    31% { transform: translateY(18px) rotate(1deg) }
    42% { transform: translateY(26px) rotate(2deg) }
    57% { transform: translateY(0) rotate(0) }
    100% { transform: translateY(0) rotate(0) }
  }

  /* Your requested first click: the original small poke from my first prototype. */
  @keyframes poke-first-custom {
    0%   { transform: translateY(0) }
    24%  { transform: translateY(6px) }
    49%  { transform: translateY(-5px) }
    70%  { transform: translateY(1px) }
    100% { transform: translateY(0) }
  }

  /* Exact flash sizing and animation from the site */
  [id^="flash-"] {
    pointer-events: none;
    opacity: 0;
    z-index: 9998;
    width: 160px;
    height: 160px;
    position: fixed;
    left: 0;
    top: 0;
    will-change: transform, opacity;
  }
  [id^="flash-"] svg { width: 100%; height: 100%; }
  @keyframes flash-pop {
    0% { opacity: 0; transform: translate(-50%,-50%) scale(.2) }
    5% { opacity: 1 }
    20% { transform: translate(-50%,-50%) scale(1.15) }
    50% { opacity: 1; transform: translate(-50%,-50%) scale(.95) }
    100% { opacity: 0; transform: translate(-50%,-50%) scale(1) }
  }
  [id^="flash-"].flash-active {
    animation: .3s ease-out forwards flash-pop;
  }
  [id^="flash-"].flash-small {
    width: 120px;
    height: 120px;
  }


  /* ---------------------------------------------------------
     ANARCHY MODE
     --------------------------------------------------------- */
  #hold-twin {
    pointer-events: none;
    position: fixed;
    left: 0;
    top: 0;
    display: none;
    opacity: 0;
    z-index: 10000;
    transform-origin: 25px 2px;
    transform: rotate(20deg) scale(.96);
    will-change: transform, opacity, left, top;
  }
  #hold-twin svg {
    display: block;
    transform-origin: 50% 100%;
    will-change: transform;
  }
  #hold-twin.visible {
    display: block;
    opacity: 1;
    animation: twin-enter 180ms cubic-bezier(.2,.9,.25,1) both;
  }
  @keyframes twin-enter {
    from { opacity: 0; transform: rotate(20deg) scale(.45); }
    70%  { opacity: 1; transform: rotate(20deg) scale(1.05); }
    to   { opacity: 1; transform: rotate(20deg) scale(.96); }
  }

  .chaos-hand {
    pointer-events: none;
    position: fixed;
    left: 0;
    top: 0;
    z-index: 9999;
    opacity: 0;
    transform: translate(-9999px, -9999px);
    transform-origin: 25px 2px;
    will-change: transform, opacity;
  }
  .chaos-hand svg {
    display: block;
    width: 44px;
    height: 414px;
    overflow: visible;
    transform-origin: 50% 100%;
  }
  .chaos-burst {
    pointer-events: none;
    position: fixed;
    width: 130px;
    height: 130px;
    z-index: 9997;
    transform: translate(-50%, -50%);
    will-change: transform, opacity;
  }
  .chaos-burst svg { width: 100%; height: 100%; display: block; }

  @keyframes title-chaos {
    0%   { transform: translate(0,0) rotate(0deg); }
    20%  { transform: translate(-3px,1px) rotate(-.4deg); }
    40%  { transform: translate(4px,-2px) rotate(.5deg); }
    60%  { transform: translate(-1px,3px) rotate(.2deg); }
    80%  { transform: translate(2px,-1px) rotate(-.3deg); }
    100% { transform: translate(0,0) rotate(0deg); }
  }
  body.chaos-on .stage h1 {
    animation: title-chaos 240ms steps(2, end) infinite;
  }
  body.chaos-on {
    background:
      radial-gradient(circle at 50% 45%, rgba(255,255,255,.95), rgba(243,242,237,.88) 42%, rgba(230,228,220,.95));
  }


  /* ---------------------------------------------------------
     FINALES
     --------------------------------------------------------- */
  .finale-hand {
    pointer-events: none;
    position: fixed;
    left: 0;
    top: 0;
    z-index: 10006;
    opacity: 0;
    transform-origin: 25px 2px;
    will-change: transform, opacity, filter;
  }
  .finale-hand svg {
    display: block;
    transform-origin: 50% 100%;
    overflow: visible;
  }

  .impact-hole {
    pointer-events: none;
    position: fixed;
    z-index: 9996;
    width: 44px;
    height: 44px;
    border-radius: 48% 52% 44% 56% / 54% 43% 57% 46%;
    background:
      radial-gradient(circle at 43% 39%,
        #050505 0 22%,
        #141414 23% 34%,
        #292929 35% 39%,
        #050505 40% 52%,
        transparent 53%);
    box-shadow:
      0 0 0 8px rgba(0,0,0,.08),
      0 0 0 16px rgba(0,0,0,.035),
      0 14px 22px rgba(0,0,0,.22);
    transform: translate(-50%,-50%) scale(.05) rotate(-8deg);
    opacity: 0;
    will-change: transform, opacity, filter;
  }
  .impact-hole::before,
  .impact-hole::after {
    content: "";
    position: absolute;
    inset: -56%;
    border-radius: 50%;
    background:
      conic-gradient(
        from 10deg,
        transparent 0 4%,
        rgba(0,0,0,.7) 4.2% 4.8%,
        transparent 5% 13%,
        rgba(0,0,0,.48) 13.2% 13.8%,
        transparent 14% 24%,
        rgba(0,0,0,.7) 24.2% 24.9%,
        transparent 25% 39%,
        rgba(0,0,0,.45) 39.2% 39.8%,
        transparent 40% 58%,
        rgba(0,0,0,.7) 58.1% 58.7%,
        transparent 59% 73%,
        rgba(0,0,0,.48) 73.1% 73.8%,
        transparent 74% 89%,
        rgba(0,0,0,.7) 89.2% 89.8%,
        transparent 90% 100%);
    -webkit-mask: radial-gradient(circle, transparent 0 47%, #000 48% 53%, transparent 54%);
    mask: radial-gradient(circle, transparent 0 47%, #000 48% 53%, transparent 54%);
    opacity: .65;
  }
  .impact-hole::after {
    inset: -82%;
    transform: rotate(17deg);
    opacity: .34;
  }

  .finale-label {
    pointer-events: none;
    position: fixed;
    left: 50%;
    top: 11%;
    transform: translateX(-50%);
    z-index: 10020;
    font: 900 clamp(18px, 3vw, 38px)/1 Arial, Helvetica, sans-serif;
    letter-spacing: .08em;
    color: #111;
    opacity: 0;
    white-space: nowrap;
    text-shadow: 0 2px 0 rgba(255,255,255,.7);
  }


  /* Fast hold: readable machine-gun poke. */
  @keyframes poke-hold-fast {
    0%   { transform: translateY(0) rotate(0deg); }
    18%  { transform: translateY(-7px) rotate(-1deg); }
    48%  { transform: translateY(30px) rotate(2.5deg); }
    68%  { transform: translateY(7px) rotate(.5deg); }
    100% { transform: translateY(0) rotate(0deg); }
  }


  /* FAST HOLD FX: rapid impact flashes + screen/title shake. */
  @keyframes fast-screen-shake {
    0%   { transform: translate(0,0) rotate(0deg); }
    20%  { transform: translate(-2px,1px) rotate(-.12deg); }
    40%  { transform: translate(2px,-1px) rotate(.12deg); }
    60%  { transform: translate(-1px,-2px) rotate(.08deg); }
    80%  { transform: translate(2px,2px) rotate(-.08deg); }
    100% { transform: translate(0,0) rotate(0deg); }
  }
  @keyframes fast-title-shake {
    0%   { transform: translate(0,0) rotate(0deg); }
    25%  { transform: translate(-4px,1px) rotate(-.35deg); }
    50%  { transform: translate(4px,-2px) rotate(.35deg); }
    75%  { transform: translate(-2px,2px) rotate(-.2deg); }
    100% { transform: translate(0,0) rotate(0deg); }
  }
  body.fast-hold-on .stage {
    animation: fast-screen-shake 72ms steps(2,end) infinite;
  }
  body.fast-hold-on .stage h1 {
    animation: fast-title-shake 64ms steps(2,end) infinite;
  }

</style>
</head>
<body>
  <main class="stage">
    <div>
      <h1>CLICK LIKE YOU MEAN IT.</h1>
    </div>
  </main>

<script>
(() => {
  "use strict";

  const cursor = document.getElementById('hero-cursor');
  const pointer = document.getElementById('hero-pointer');

  let mouseX = innerWidth / 2;
  let mouseY = innerHeight / 2;
  let clickTimes = [];

  const levels = [
    { name: 'poke-gentle', dur: '360ms', easing: 'ease-out' },
    { name: 'poke-medium', dur: '440ms', easing: 'linear' },
    { name: 'poke-strong', dur: '540ms', easing: 'linear' },
    { name: 'poke-jab', dur: '700ms', easing: 'linear' }
  ];


  let handCloneSerial = 0;
  function makeFullPointerClone() {
    const art = pointer.cloneNode(true);
    art.removeAttribute('id');
    art.setAttribute('width', '44');
    art.setAttribute('height', '414');
    art.style.width = '44px';
    art.style.height = '414px';
    art.style.overflow = 'visible';
    art.style.animation = 'none';

    // Every inline SVG gets its own gradient id. Duplicate ids can make
    // url(#cursor-body-grad) resolve unpredictably when lots of hands exist.
    const gradient = art.querySelector('#cursor-body-grad');
    if (gradient) {
      const uniqueId = `cursor-body-grad-chaos-${++handCloneSerial}`;
      gradient.id = uniqueId;
      art.querySelectorAll('[fill="url(#cursor-body-grad)"]').forEach(node => {
        node.setAttribute('fill', `url(#${uniqueId})`);
      });
    }
    return art;
  }

  // Second hand used while LMB is held.
  const twinCursor = document.createElement('div');
  twinCursor.id = 'hold-twin';
  const twinPointer = makeFullPointerClone();
  twinPointer.classList.add('twin-pointer');
  twinCursor.appendChild(twinPointer);
  document.body.appendChild(twinCursor);

  function positionTwin() {
    twinCursor.style.left = (mouseX - 25) + 'px';
    twinCursor.style.top = (mouseY - 2) + 'px';
  }

  function hideTwin() {
    twinCursor.classList.remove('visible');
    twinCursor.style.display = 'none';
  }

  function moveCursor(e) {
    mouseX = e.clientX;
    mouseY = e.clientY;
    cursor.style.left = (mouseX - 25) + 'px';
    cursor.style.top = (mouseY - 2) + 'px';
    if (!holdActive && !chaosActive) cursor.style.display = 'block';
    positionTwin();
  }

  document.addEventListener('mousemove', moveCursor, { passive: true });
  document.addEventListener('mouseenter', () => cursor.style.display = 'block');
  document.addEventListener('mouseleave', () => { if (!holdActive && !chaosActive) cursor.style.display = 'none'; });

  function flashForClick(count) {
    if (count < 2) return null;
    const t = count - 2;
    return t < 5 ? `flash-${t + 1}` : `flash-${(t - 5) % 3 + 3}`;
  }

  function flash(id, x, y) {
    const el = document.getElementById(id);
    if (!el) return;
    el.style.left = x + 'px';
    el.style.top = y + 'px';
    el.classList.remove('flash-active');
    el.getBoundingClientRect();
    el.classList.add('flash-active');
  }

  function smallFlash(id, x, y) {
    const el = document.getElementById(id);
    if (!el) return;
    el.classList.add('flash-small');
    flash(id, x, y);
    setTimeout(() => el.classList.remove('flash-small'), 320);
  }

  function animatePointer(el, name, dur, easing) {
    el.style.animation = 'none';
    el.getBoundingClientRect();
    el.style.animation = `${name} ${dur} ${easing} forwards`;
  }

  function triggerVisualHit() {
    const now = Date.now();
    const previous = clickTimes[clickTimes.length - 1];
    if (!previous || now - previous > 800) clickTimes = [];
    clickTimes.push(now);

    const count = clickTimes.length;
    const intensity = Math.min(count - 1, 3);

    pointer.style.animation = 'none';
    pointer.getBoundingClientRect();

    if (count === 1) {
      pointer.style.animation = 'poke-first-custom 340ms cubic-bezier(.18,.9,.22,1)';
      smallFlash('flash-1', mouseX - 6, mouseY + 2);
      return;
    }

    const { name, dur, easing } = levels[intensity];
    pointer.style.animation = `${name} ${dur} ${easing} forwards`;

    const primary = flashForClick(count);
    if (primary) flash(primary, mouseX, mouseY);

    if (intensity === 3) {
      const x = mouseX, y = mouseY;
      setTimeout(() => flash('flash-1', x - 8, y), 400);
    }
    if (intensity === 2) {
      const x = mouseX, y = mouseY;
      setTimeout(() => smallFlash('flash-1', x - 8, y), 460);
    }
  }

  function cloneBurst(x, y, size = 120, flashIndex = 1) {
    const src = document.querySelector(`#flash-${flashIndex} svg`);
    if (!src) return;
    const wrap = document.createElement('div');
    wrap.className = 'chaos-burst';
    wrap.style.left = x + 'px';
    wrap.style.top = y + 'px';
    wrap.style.width = size + 'px';
    wrap.style.height = size + 'px';
    wrap.appendChild(src.cloneNode(true));
    document.body.appendChild(wrap);
    const anim = wrap.animate([
      { opacity: 0, transform: 'translate(-50%,-50%) scale(.15) rotate(-8deg)' },
      { opacity: 1, transform: 'translate(-50%,-50%) scale(1.22) rotate(4deg)', offset: .22 },
      { opacity: .92, transform: 'translate(-50%,-50%) scale(.92) rotate(0deg)', offset: .55 },
      { opacity: 0, transform: 'translate(-50%,-50%) scale(1.08) rotate(3deg)' }
    ], { duration: 330, easing: 'ease-out', fill: 'forwards' });
    anim.finished.finally(() => wrap.remove());
  }

  function twinHit() {
    if (!holdActive) return;
    animatePointer(twinPointer, 'poke-jab', '700ms', 'linear');
    const x = mouseX, y = mouseY;
    setTimeout(() => {
      if (holdActive) cloneBurst(x + 3, y + 1, 86, 1);
    }, 182);
  }

  const activeChaosHands = new Set();
  let chaosSerial = 0;

  let chaosSideBag = [];

  function nextChaosSide() {
    if (chaosSideBag.length === 0) {
      chaosSideBag = [0, 1, 2, 3];
      for (let i = chaosSideBag.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [chaosSideBag[i], chaosSideBag[j]] = [chaosSideBag[j], chaosSideBag[i]];
      }
    }
    return chaosSideBag.pop();
  }

  function edgeStart(targetX, targetY) {
    const pad = 170;
    const side = nextChaosSide();

    if (side === 0) {
      return { x: -pad, y: 30 + Math.random() * Math.max(80, innerHeight - 60), rot: 68 + Math.random() * 55 };
    }
    if (side === 1) {
      return { x: innerWidth + pad, y: 30 + Math.random() * Math.max(80, innerHeight - 60), rot: -68 - Math.random() * 55 };
    }
    if (side === 2) {
      return { x: 30 + Math.random() * Math.max(80, innerWidth - 60), y: -430, rot: 150 + Math.random() * 70 };
    }
    return { x: 30 + Math.random() * Math.max(80, innerWidth - 60), y: innerHeight + 80, rot: -25 + Math.random() * 50 };
  }


  function spawnChaosHand(variant = null, targetX = mouseX, targetY = mouseY, delay = 0) {
    if (activeChaosHands.size >= 14) {
      const first = activeChaosHands.values().next().value;
      if (first) {
        first.remove();
        activeChaosHands.delete(first);
      }
    }

    const wrap = document.createElement('div');
    wrap.className = 'chaos-hand';

    const art = makeFullPointerClone();
    wrap.appendChild(art);
    document.body.appendChild(wrap);
    activeChaosHands.add(wrap);

    const start = edgeStart(targetX, targetY);

    // Slightly different hit point / size for every hand.
    const tx = targetX - 25 + (Math.random() - .5) * 40;
    const ty = targetY - 2 + (Math.random() - .5) * 30;
    const sc = .55 + Math.random() * .82;

    const kinds = ['slam', 'bounce', 'ghost', 'spin', 'cross'];
    const kind = variant || kinds[Math.floor(Math.random() * kinds.length)];

    const exitKinds = [
      'dissolve',
      'flyaway',
      'drop',
      'explode',
      'spinout',
      'shrink',
      'rebound',
      'linger'
    ];
    const exitKind = exitKinds[Math.floor(Math.random() * exitKinds.length)];

    let duration;
    let impactAt;
    let frames;
    let impactScale = 1.08;

    if (kind === 'ghost') {
      duration = 1180;
      impactAt = .56;
      impactScale = 1.00;
      frames = [
        {
          opacity: 0,
          transform: `translate(${start.x}px,${start.y}px) rotate(${start.rot}deg) scale(${sc * .78})`
        },
        {
          opacity: .34,
          offset: .16,
          transform: `translate(${start.x * .72 + tx * .28}px,${start.y * .72 + ty * .28}px) rotate(${start.rot + 50}deg) scale(${sc * .86})`
        },
        {
          opacity: .68,
          offset: .38,
          transform: `translate(${start.x * .36 + tx * .64}px,${start.y * .36 + ty * .64}px) rotate(${start.rot + 92}deg) scale(${sc})`
        },
        {
          opacity: .82,
          offset: impactAt,
          transform: `translate(${tx}px,${ty}px) rotate(-20deg) scale(${sc * impactScale})`
        }
      ];
    } else if (kind === 'spin') {
      duration = 1080;
      impactAt = .68;
      impactScale = 1.10;
      frames = [
        {
          opacity: 1,
          transform: `translate(${start.x}px,${start.y}px) rotate(${start.rot}deg) scale(${sc})`
        },
        {
          opacity: 1,
          offset: .34,
          transform: `translate(${(start.x + tx) / 2}px,${(start.y + ty) / 2 - 100}px) rotate(${start.rot + 300}deg) scale(${sc * 1.03})`
        },
        {
          opacity: 1,
          offset: .54,
          transform: `translate(${tx + (Math.random() > .5 ? 55 : -55)}px,${ty - 55}px) rotate(${start.rot + 520}deg) scale(${sc * 1.08})`
        },
        {
          opacity: 1,
          offset: impactAt,
          transform: `translate(${tx}px,${ty}px) rotate(-20deg) scale(${sc * impactScale})`
        }
      ];
    } else if (kind === 'bounce') {
      duration = 1020;
      impactAt = .54;
      impactScale = 1.08;
      frames = [
        {
          opacity: 1,
          transform: `translate(${start.x}px,${start.y}px) rotate(${start.rot}deg) scale(${sc})`
        },
        {
          opacity: 1,
          offset: .34,
          transform: `translate(${start.x * .45 + tx * .55}px,${start.y * .45 + ty * .55 - 60}px) rotate(${start.rot * .4 - 12}deg) scale(${sc * .94})`
        },
        {
          opacity: 1,
          offset: impactAt,
          transform: `translate(${tx}px,${ty}px) rotate(-20deg) scale(${sc * impactScale})`
        }
      ];
    } else if (kind === 'cross') {
      duration = 980;
      impactAt = .62;
      impactScale = 1.10;

      const midX = tx + (Math.random() > .5 ? 150 : -150);
      const midY = ty - 125;

      frames = [
        {
          opacity: 1,
          transform: `translate(${start.x}px,${start.y}px) rotate(${start.rot}deg) scale(${sc})`
        },
        {
          opacity: 1,
          offset: .36,
          transform: `translate(${midX}px,${midY}px) rotate(${start.rot + 120}deg) scale(${sc * 1.02})`
        },
        {
          opacity: 1,
          offset: impactAt,
          transform: `translate(${tx}px,${ty}px) rotate(-20deg) scale(${sc * impactScale})`
        }
      ];
    } else {
      duration = 900;
      impactAt = .64;
      impactScale = 1.15;

      frames = [
        {
          opacity: 1,
          transform: `translate(${start.x}px,${start.y}px) rotate(${start.rot}deg) scale(${sc})`
        },
        {
          opacity: 1,
          offset: .42,
          transform: `translate(${tx}px,${ty - 125}px) rotate(-24deg) scale(${sc * .90})`
        },
        {
          opacity: 1,
          offset: impactAt,
          transform: `translate(${tx}px,${ty}px) rotate(-20deg) scale(${sc * impactScale})`
        }
      ];
    }

    // Every hand attacks differently AND leaves differently.
    const baseHit = `translate(${tx}px,${ty}px) rotate(-20deg) scale(${sc * impactScale})`;

    if (exitKind === 'dissolve') {
      frames.push(
        {
          opacity: .55,
          offset: .82,
          filter: 'blur(1px)',
          transform: `translate(${tx + 12}px,${ty - 15}px) rotate(-8deg) scale(${sc * 1.16})`
        },
        {
          opacity: 0,
          filter: 'blur(8px)',
          transform: `translate(${tx + 38}px,${ty - 52}px) rotate(24deg) scale(${sc * 1.34})`
        }
      );
    } else if (exitKind === 'flyaway') {
      const angle = Math.random() * Math.PI * 2;
      const dist = Math.max(innerWidth, innerHeight) * (1.0 + Math.random() * .65);
      const fx = tx + Math.cos(angle) * dist;
      const fy = ty + Math.sin(angle) * dist;

      frames.push(
        {
          opacity: 1,
          offset: .76,
          transform: baseHit
        },
        {
          opacity: .88,
          offset: .87,
          transform: `translate(${tx + Math.cos(angle) * 110}px,${ty + Math.sin(angle) * 110}px) rotate(${120 + Math.random() * 160}deg) scale(${sc})`
        },
        {
          opacity: 0,
          transform: `translate(${fx}px,${fy}px) rotate(${420 + Math.random() * 420}deg) scale(${sc * .72})`
        }
      );
    } else if (exitKind === 'drop') {
      const drift = (Math.random() - .5) * 240;
      frames.push(
        {
          opacity: 1,
          offset: .78,
          transform: baseHit
        },
        {
          opacity: .96,
          offset: .86,
          transform: `translate(${tx + drift * .15}px,${ty + 80}px) rotate(${70 + Math.random() * 70}deg) scale(${sc})`
        },
        {
          opacity: 0,
          transform: `translate(${tx + drift}px,${innerHeight + 520}px) rotate(${240 + Math.random() * 360}deg) scale(${sc * .84})`
        }
      );
    } else if (exitKind === 'explode') {
      frames.push(
        {
          opacity: 1,
          offset: .78,
          transform: `translate(${tx}px,${ty}px) rotate(-20deg) scale(${sc * 1.28})`
        },
        {
          opacity: .95,
          offset: .83,
          transform: `translate(${tx}px,${ty}px) rotate(${Math.random() * 35 - 18}deg) scale(${sc * 1.52})`
        },
        {
          opacity: 0,
          transform: `translate(${tx}px,${ty}px) rotate(${Math.random() * 180}deg) scale(.03)`
        }
      );
    } else if (exitKind === 'spinout') {
      const dir = Math.random() > .5 ? 1 : -1;
      frames.push(
        {
          opacity: 1,
          offset: .78,
          transform: baseHit
        },
        {
          opacity: .92,
          offset: .88,
          transform: `translate(${tx + dir * 150}px,${ty - 80}px) rotate(${dir * 380}deg) scale(${sc})`
        },
        {
          opacity: 0,
          transform: `translate(${tx + dir * (innerWidth * .8 + 300)}px,${ty - 280 + Math.random() * 560}px) rotate(${dir * (900 + Math.random() * 500)}deg) scale(${sc * .70})`
        }
      );
    } else if (exitKind === 'shrink') {
      frames.push(
        {
          opacity: 1,
          offset: .80,
          transform: baseHit
        },
        {
          opacity: .9,
          offset: .90,
          transform: `translate(${tx}px,${ty}px) rotate(${Math.random() * 80 - 40}deg) scale(${sc * .35})`
        },
        {
          opacity: 0,
          transform: `translate(${tx}px,${ty}px) rotate(${Math.random() * 180 - 90}deg) scale(.015)`
        }
      );
    } else if (exitKind === 'rebound') {
      const rx = tx + (start.x - tx) * (.42 + Math.random() * .20);
      const ry = ty + (start.y - ty) * (.42 + Math.random() * .20);

      frames.push(
        {
          opacity: 1,
          offset: .74,
          transform: baseHit
        },
        {
          opacity: 1,
          offset: .83,
          transform: `translate(${tx - (start.x - tx) * .10}px,${ty - (start.y - ty) * .10}px) rotate(12deg) scale(${sc * 1.12})`
        },
        {
          opacity: 0,
          transform: `translate(${rx}px,${ry}px) rotate(${start.rot + 240}deg) scale(${sc * .78})`
        }
      );
    } else {
      // Linger at the target, then evaporate in place.
      frames.push(
        {
          opacity: 1,
          offset: .84,
          transform: baseHit
        },
        {
          opacity: 1,
          offset: .92,
          transform: `translate(${tx}px,${ty}px) rotate(-18deg) scale(${sc * 1.02})`
        },
        {
          opacity: 0,
          transform: `translate(${tx}px,${ty - 18}px) rotate(-10deg) scale(${sc * 1.06})`
        }
      );
    }

    wrap.style.opacity = String(frames[0].opacity ?? 1);
    wrap.style.transform = frames[0].transform;

    // Slow enough that you can actually see: approach -> hit -> exit.
    duration *= 1.48 + Math.random() * .42;

    setTimeout(() => {
      if (!wrap.isConnected) return;

      const anim = wrap.animate(frames, {
        duration,
        easing: kind === 'slam'
          ? 'cubic-bezier(.18,.82,.18,1)'
          : 'cubic-bezier(.22,.72,.25,1)',
        fill: 'forwards'
      });

      const impactDelay = duration * impactAt;

      setTimeout(() => {
        if (!wrap.isConnected) return;

        cloneBurst(
          targetX + (Math.random() - .5) * 12,
          targetY + (Math.random() - .5) * 10,
          kind === 'slam' ? 155 : 100 + Math.random() * 50,
          1 + Math.floor(Math.random() * 5)
        );

        if (exitKind === 'explode') {
          setTimeout(() => {
            if (!wrap.isConnected) return;
            cloneBurst(targetX - 22, targetY + 8, 110 + Math.random() * 45, 4);
            cloneBurst(targetX + 24, targetY - 12, 90 + Math.random() * 35, 2);
            cloneBurst(targetX + 4, targetY + 26, 75 + Math.random() * 30, 5);
          }, 55);
        }
      }, impactDelay);

      anim.finished.finally(() => {
        activeChaosHands.delete(wrap);
        wrap.remove();
      });
    }, delay);
  }


  function miniBarrage() {
    const x = mouseX, y = mouseY;
    spawnChaosHand('slam', x - 7, y + 2, 0);
    spawnChaosHand('spin', x + 5, y - 2, 260);
    spawnChaosHand('bounce', x, y + 3, 520);
  }

  const HOLD_DELAY = 150;
  const FAST_HOLD_SPEED = 92; // ~10.9 pokes / second

  let holdDelayTimer = null;
  let holdFxTimer = null;
  let holdActive = false;
  let suppressNextClick = false;
  let fastFxIndex = 0;

  function fastHoldImpactFx() {
    if (!holdActive) return;

    const ids = ['flash-1','flash-2','flash-3','flash-4','flash-5'];
    const id = ids[fastFxIndex++ % ids.length];
    const jitterX = (Math.random() - .5) * 8;
    const jitterY = (Math.random() - .5) * 7;

    flash(id, mouseX + jitterX, mouseY + jitterY);

    // Every few hits add a smaller secondary spark so it feels violent,
    // without spawning a huge amount of new DOM nodes every frame.
    if (fastFxIndex % 3 === 0) {
      smallFlash('flash-1', mouseX - 6 + jitterX * .4, mouseY + 2 + jitterY * .4);
    }
  }

  function startFastHold() {
    if (holdActive) return;
    holdActive = true;
    suppressNextClick = true;
    clickTimes = [];

    cursor.style.left = (mouseX - 25) + 'px';
    cursor.style.top = (mouseY - 2) + 'px';
    cursor.style.display = 'block';

    pointer.style.animation = 'none';
    pointer.getBoundingClientRect();
    pointer.style.animation = `poke-hold-fast ${FAST_HOLD_SPEED}ms linear infinite`;

    document.body.classList.add('fast-hold-on');
    fastHoldImpactFx();
    clearInterval(holdFxTimer);
    holdFxTimer = setInterval(fastHoldImpactFx, FAST_HOLD_SPEED);
  }

  function stopFastHold() {
    clearTimeout(holdDelayTimer);
    holdDelayTimer = null;
    clearInterval(holdFxTimer);
    holdFxTimer = null;
    document.body.classList.remove('fast-hold-on');

    if (!holdActive) return;
    holdActive = false;
    pointer.style.animation = 'none';
    pointer.getBoundingClientRect();
  }

  document.addEventListener('pointerdown', e => {
    if (e.button !== 0) return;

    clearTimeout(holdDelayTimer);
    holdActive = false;
    suppressNextClick = false;

    holdDelayTimer = setTimeout(startFastHold, HOLD_DELAY);
  });

  document.addEventListener('pointerup', e => {
    if (e.button !== 0) return;
    stopFastHold();
  });

  document.addEventListener('pointercancel', stopFastHold);
  window.addEventListener('blur', stopFastHold);

  document.addEventListener('click', e => {
    if (e.button !== 0) return;

    if (suppressNextClick) {
      suppressNextClick = false;
      return;
    }

    triggerVisualHit();
  });

  document.addEventListener('dragstart', e => e.preventDefault());
  document.addEventListener('selectstart', e => e.preventDefault());
})();
</script>
</body>
