[package]
name = "viralcursor"
version = "1.0.0"
description = "Turns your Windows cursor into the giant poking hand."
edition = "2021"
rust-version = "1.83"

[lib]
name = "viralcursor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Cargo names the binary after the package; the shipped file has to be ViralCursor.exe.
[[bin]]
name = "ViralCursor"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Magnification",
    "Win32_UI_WindowsAndMessaging",
]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
